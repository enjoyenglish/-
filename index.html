<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>所見管理システム（だ・である調・過去形）</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: "Helvetica Neue", Arial, sans-serif; line-height: 1.5; max-width: 1550px; margin: 1em auto; padding: 0 1em; background: #f4f7f9; color: #333; }
        .card { background: white; padding: 1.5em; border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); margin-bottom: 1.5em; }
        h1 { color: #0056b3; font-size: 1.3em; border-left: 6px solid #0056b3; padding-left: 12px; margin-bottom: 20px; }
        .setup-container { display: flex; gap: 20px; }
        .setup-box { flex: 1; border: 2px dashed #007bff; padding: 20px; text-align: center; background: #f0f8ff; border-radius: 8px; }
        #manualInputArea { width: 100%; height: 70px; margin-top: 10px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        table { width: 100%; border-collapse: collapse; background: white; table-layout: fixed; }
        th, td { border: 1px solid #dee2e6; padding: 10px; vertical-align: middle; }
        th { background: #007bff; color: white; position: sticky; top: 0; z-index: 10; font-size: 0.85em; }
        .col-name { width: 140px; font-weight: bold; background: #f8f9fa; }
        .col-traits { width: 500px; }
        .col-eval { width: 100px; }
        .col-action { width: 100px; }
        .trait-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; font-size: 0.75em; }
        .trait-grid label { display: flex; align-items: center; background: #fdfdfd; border: 1px solid #ced4da; padding: 4px; border-radius: 4px; cursor: pointer; }
        .result-box { width: 100%; height: 110px; padding: 10px; border: 2px solid #ffd33d; border-radius: 5px; background: #fffdf0; font-size: 0.95em; line-height: 1.6; resize: vertical; box-sizing: border-box; }
        .btn { border: none; border-radius: 4px; cursor: pointer; font-weight: bold; padding: 10px 15px; }
        .btn-main { background: #007bff; color: white; margin-top: 10px; }
        .btn-shuffle { background: #6c757d; color: white; font-size: 0.8em; width: 100%; height: 40px; }
        .btn-csv { background: #28a745; color: white; font-size: 1.1em; }
        .sticky-header { position: sticky; top: 0; background: #f4f7f9; padding: 15px 0; z-index: 20; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #007bff; }
    </style>
</head>
<body>

<div class="card">
    <h1>1. 名簿登録（Excel読込 または 手入力）</h1>
    <div class="setup-container">
        <div class="setup-box">
            <strong>Excel読み込み</strong><br>
            <input type="file" accept=".xlsx, .xls" onchange="processExcel(this)">
        </div>
        <div class="setup-box">
            <strong>手入力・貼り付け</strong><br>
            <textarea id="manualInputArea" placeholder="出席番号 名前"></textarea><br>
            <button class="btn btn-main" onclick="processManual()">この内容で名簿を作成</button>
        </div>
    </div>
</div>

<div id="mainSection" style="display:none;">
    <div class="sticky-header">
        <div><strong>2. 所見リアルタイム作成</strong></div>
        <button class="btn btn-csv" onclick="exportToCSV()">全員分をCSV保存</button>
    </div>
    
    <div class="card" style="padding:0; overflow-x: auto;">
        <table>
            <thead>
                <tr>
                    <th class="col-name">生徒名</th>
                    <th class="col-traits">性格（11項目）</th>
                    <th class="col-eval">学習</th>
                    <th class="col-action">入れ替え</th>
                    <th>生成結果（直接編集可）</th>
                </tr>
            </thead>
            <tbody id="studentBody"></tbody>
        </table>
    </div>
</div>

<script>
const traitsDB = {
    "優しい": ["周囲の状況をよく見て、困っている友人にそっと寄り添う自然な優しさがあった。","他者の喜びを自分のことのように大切にできる、温かな心の持ち主だった。","誰に対しても分け隔てなく接し、クラスの雰囲気を柔らかく包み込んだ。"],
    "真面目": ["与えられた役割を最後まで責任を持って果たし、周囲からの厚い信頼を得た。","一つ一つの課題に対して丁寧に向き合い、妥協のない姿勢を貫いた。","地道な準備や片付けを厭わず、常に誠実な態度で生活を送った。"],
    "努力家": ["地道な積み重ねを一日も欠かさず継続し、着実に力を伸ばした。","目標に向かって一歩ずつ進むひたむきな姿勢が、多くの場面で見られた。","苦手なことからも逃げ出さず、克服しようと努力する強さを持っていた。"],
    "活発": ["何事にも意欲的に挑戦し、クラス全体に活気を与える原動力となった。","自分の考えをはっきりと表現し、集団の活発な活動に大きく貢献した。","持ち前の明るさで周囲を巻き込み、話し合いを盛り上げる姿が印象的だった。"],
    "穏やか": ["落ち着いた物腰で、周囲に安心感を与える大切な存在だった。","誰に対しても一貫して穏やかに接し、クラスの和を支えた。","感情を上手にコントロールし、周囲と円満な関係を築いた。"],
    "慎重": ["物事に取り組む前にしっかりと考えを巡らせ、丁寧な一歩を踏み出した。","細かな点にも注意を払い、ミスを防ごうとする確実な仕事ぶりが光った。","安全や手順をよく確認してから行動する、落ち着いた判断力があった。"],
    "独創的": ["既存の枠にとらわれない豊かな発想を持ち、独自の視点で工夫を凝らす姿が見られた。","自分らしい工夫を凝らした素晴らしい表現活動を数多く展開した。","発想がユニークで、クラスの課題に対して新しい解決策を提案した。"],
    "責任感": ["自分の仕事を最後まで投げ出さず、やり遂げようとする強い責任感を持っていた。","クラスの約束事を守り、規律ある生活を自ら実践した。","任された当番活動を誠実に遂行し、集団のために尽力した。"],
    "協調的": ["仲間の意見を尊重しながら物事を円滑に進める、優れた調整役として活躍した。","周囲と協力して一つの目標を達成する喜びを、身をもって示した。","集団の中での自分の役割を理解し、友人と助け合って活動した。"],
    "探究心": ["「なぜ」という疑問を大切にし、納得がいくまで自ら調べようとする熱心な姿勢があった。","興味を持った分野に対して、専門的な知識を深めようとする集中力が素晴らしかった。","未知の事柄に対しても知的好奇心を持って向き合い、探究を深めた。"],
    "礼儀正しい": ["誰に対しても節度ある態度で接し、気持ちの良い挨拶を欠かさない清々しさがあった。","感謝の言葉を素直に伝えることができ、周囲からも好感を持たれる人柄だった。","時と場合に応じた適切な言葉遣いができ、マナーの良さが際立った。"]
};

const gradesDB = {
    "A": ["授業の内容を深く理解し、鋭い視点から独自の考えを深めた。", "高度な課題に対しても自律的に問いを立て、探究的に解決する姿が見られた。"],
    "B": ["毎時間の課題に真面目に取り組み、教えられた内容を確実に定着させた。", "基礎的な理解を深め、学んだ知識を授業内で適切に活用した。"],
    "C": ["一歩ずつ理解を深めようとする、粘り強い姿勢で学習に向き合った。", "丁寧な反復練習を通じて、着実に基礎学力を身につけようと努力した。"]
};

function processExcel(input) {
    const file = input.files[0];
    const reader = new FileReader();
    reader.onload = (e) => {
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, {type: 'array'});
        const ws = wb.Sheets[wb.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(ws, {header: 1});
        const names = json.map(row => row.join(" ")).filter(s => s.trim() !== "");
        buildTable(names);
    };
    reader.readAsArrayBuffer(file);
}

function processManual() {
    const names = document.getElementById('manualInputArea').value.split('\n').filter(s => s.trim() !== "");
    if(names.length === 0) return alert("名前を入力してください");
    buildTable(names);
}

function buildTable(names) {
    const body = document.getElementById('studentBody');
    body.innerHTML = "";
    names.forEach((name, i) => {
        let grid = `<div class="trait-grid">`;
        Object.keys(traitsDB).forEach(key => {
            grid += `<label><input type="checkbox" class="t-check-${i}" value="${key}" onchange="runGen(${i})"> ${key}</label>`;
        });
        grid += `</div>`;
        const row = document.createElement('tr');
        row.innerHTML = `<td class="col-name" id="name_${i}">${name}</td><td class="col-traits">${grid}</td><td class="col-eval"><select id="grade_${i}" onchange="runGen(${i})"><option value="A">A</option><option value="B" selected>B</option><option value="C">C</option></select></td><td class="col-action"><button class="btn btn-shuffle" onclick="runGen(${i})">🔄 変更</button></td><td><textarea class="result-box" id="out_${i}" placeholder="項目を選ぶと自動生成"></textarea></td>`;
        body.appendChild(row);
    });
    document.getElementById('mainSection').style.display = "block";
}

function runGen(idx) {
    const checks = Array.from(document.querySelectorAll(`.t-check-${idx}:checked`)).map(el => el.value);
    const grade = document.getElementById(`grade_${idx}`).value;
    const outField = document.getElementById(`out_${idx}`);
    if (checks.length === 0) { outField.value = ""; return; }
    let resultText = checks.map(k => {
        const patterns = traitsDB[k];
        return patterns[Math.floor(Math.random() * patterns.length)];
    }).join("");
    const gradePatterns = gradesDB[grade];
    resultText += gradePatterns[Math.floor(Math.random() * gradePatterns.length)];
    outField.value = resultText;
}

function exportToCSV() {
    let csv = "\uFEFF氏名,所見本文\n";
    const rows = document.getElementById('studentBody').querySelectorAll('tr');
    rows.forEach((r, i) => {
        const name = document.getElementById(`name_${i}`).innerText;
        const text = document.getElementById(`out_${i}`).value.replace(/"/g, '""'); 
        csv += `"${name}","${text}"\n`;
    });
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "所見データ.csv";
    link.click();
}
</script>
</body>
</html>
