<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>所見一括作成システム（名前なし・編集保存版）</title>
    <style>
        body { font-family: sans-serif; line-height: 1.4; max-width: 1200px; margin: 2em auto; padding: 0 1em; background: #f4f7f9; color: #333; }
        .card { background: white; padding: 1.5em; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 2em; }
        h1 { color: #0056b3; border-bottom: 2px solid #007bff; padding-bottom: 10px; font-size: 1.5em; }
        
        /* 入力エリア */
        #rosterInputArea { width: 100%; height: 120px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 1em; }
        
        /* 編集・表示エリア */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; table-layout: fixed; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; vertical-align: top; }
        th { background: #007bff; color: white; position: sticky; top: 0; z-index: 10; font-size: 0.9em; }
        
        .name-col { width: 130px; font-weight: bold; background: #f8f9fa; }
        .option-col { width: 320px; }
        .output-col { width: 450px; }

        /* 性格・学習選択 */
        .trait-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; font-size: 0.8em; margin-bottom: 8px; }
        .trait-grid label { display: flex; align-items: center; cursor: pointer; background: #f1f3f5; padding: 3px; border-radius: 3px; border: 1px solid #e1e4e8; }
        .trait-grid input { margin-right: 4px; }
        .radio-group { font-size: 0.8em; display: flex; gap: 8px; background: #fff; padding: 5px; border-radius: 4px; border: 1px solid #eee; margin-bottom: 5px; }

        /* 生成結果（直接編集可能） */
        textarea.result-box { width: 100%; height: 140px; font-size: 0.95em; padding: 10px; border: 1px solid #ffd33d; border-radius: 4px; box-sizing: border-box; background: #fffdf0; line-height: 1.6; resize: vertical; }
        textarea.result-box:focus { background: #fff; border-color: #007bff; outline: none; }

        /* ボタン類 */
        .btn { border: none; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-main { background: #007bff; color: white; padding: 10px 25px; font-size: 1em; margin-top: 10px; }
        .btn-gen { background: #007bff; color: white; padding: 6px; width: 100%; margin-top: 5px; font-size: 0.85em; }
        .btn-csv { background: #28a745; color: white; padding: 12px 25px; font-size: 1.1em; }
        .btn-copy { background: #6c757d; color: white; padding: 5px; width: 100%; margin-top: 5px; font-size: 0.75em; }
        .btn:hover { opacity: 0.8; }

        .sticky-header { position: sticky; top: 0; background: white; padding: 15px; z-index: 20; border-bottom: 3px solid #007bff; display: flex; justify-content: space-between; align-items: center; }
        .hint { font-size: 0.8em; color: #666; margin-top: 4px; }
    </style>
</head>
<body>

<div class="card">
    <h1>🏫 所見一括作成デスク</h1>
    <p>1. クラス名簿をコピーして貼り付けてください（出席番号 名前 の形式でOK）</p>
    <textarea id="rosterInputArea" placeholder="1 山田太郎&#10;2 佐藤花子&#10;3 鈴木一郎..."></textarea>
    <button class="btn btn-main" onclick="setupRoster()">名簿を反映して作成開始</button>
</div>

<div id="mainSection" style="display:none;">
    <div class="sticky-header">
        <div>
            <strong>一括作成・編集モード</strong><br>
            <span class="hint">生成ボタンを押した後、黄色い枠内を自由に編集できます。</span>
        </div>
        <button class="btn btn-csv" onclick="exportToCSV()">全員分(編集済み)をCSV保存</button>
    </div>

    <div class="card">
        <table id="studentTable">
            <thead>
                <tr>
                    <th class="name-col">氏名（管理用）</th>
                    <th class="option-col">性格・学習・役割の選択</th>
                    <th class="output-col">生成・編集欄（ここを自由に書き換え）</th>
                </tr>
            </thead>
            <tbody id="studentBody"></tbody>
        </table>
    </div>
</div>

<script>
// 文言データ（名前なし・セリフなし・室内活動対応済み）
const personalityData = {
    "優しい": ["友人の表情のわずかな曇りに気づき、そっと隣に座って耳を傾けるような、自然な優しさが光った。","自分のこと以上に、周りの友達が笑っていることを喜べる、とても心のきれいな姿が見られた。","輪に入りづらそうにしている子を見つけると、ごく自然に自分の隣を空けてあげる、柔らかい気遣いができた。","相手の痛みを自分のことのように考え、共感を持って語りかける姿に、何度も心が温まった。","相手を否定せず、最後まで話を丁寧に聞く姿勢を貫いた。","近くにいる友人の様子をさりげなく気遣い、必要な時にそっと寄り添う優しさを持っていた。","意見がぶつかっても、相手を尊重し柔軟に受け入れられる、大きな心を持っていた。","友人の失敗を責めることなく、再起を信じて温かく見守り続ける強さを見せた。","誰に対しても分け隔てなく接するその笑顔は、クラスの緊張をふんわりと解きほぐした。","自分の作業を止めてでも友人を手助けする姿は、見ていて胸が熱くなるほどだった。"],
    "芯が強い": ["周囲に流されず、自分の考えをしっかりと持って行動できた。","困難な場面でも、瞳の奥に強い意志を宿して最後まで挑み抜いた。","自分が正しいと信じる道を、静かに、力強く歩む姿が印象的だった。","失敗してもすぐに前を向き、自分の足で立ち上がる強さを持っていた。","流行に左右されすぎず、自分らしさを大切にする姿が頼もしかった。","誰かに頼り切るのではなく、まずは自力で解決しようと努力できた。","目立たない場所でも、自分の信念を曲げずに役割を全うした。","批判を恐れず、自分の感性を大切に表現活動に励んだ。","逆境においてこそ、粘り強く踏ん張る精神力の強さを見せた。","静かな佇まいの中に、決して揺るがない自分軸を持っていた。"],
    "穏やか": ["常に落ち着いた物腰で、周囲に安心感を与える大切な存在だった。","争いごとを好まず、いつも平和的な解決を模索する優しさがあった。","友人の話を穏やかな表情で聞き、場を和ませる心地よい空気を持っていた。","感情を上手にコントロールし、誰に対しても一貫して優しく接した。","静かに読書や学習に没頭する姿は、クラスに落ち着いた雰囲気をもたらした。","他者のミスを包み込むような広い心を持ち、多くの友人に慕われた。","派手な主張はなくとも、そこにいるだけで心が温まる魅力があった。","トラブルが起きた際も、冷静に状況を見つめて公平な判断ができた。","一年間を通して、変わらぬ温厚な態度でクラスの調和を支え続けた。","周囲の喧騒に流されず、自分の時間を大切にしながら安定して生活できた。"],
    "真面目": ["与えられた役割を責任を持って果たし、周囲の信頼に応えた。","板書が非常に丁寧で、後で見返したときに分かりやすく整理されていた。","提出期限を厳守し、内容の充実した成果物を毎回提出した。","掃除の時間、見えない場所まで手を抜かずに磨き上げた。","授業中、余談に流されず、常に高い集中力を維持して臨んだ。","自分の非を素直に認め、同じミスを繰り返さないよう工夫した。","準備物や宿題を決して忘れず、落ち着いた生活態度を貫いた。","派手さはないが、一つひとつの行動が丁寧で確実性に満ちていた。","何が正しいかを一生懸命に考えて行動できる、誠実な人柄が光っていた。","地道な努力を積み重ねることを厭わない姿勢は、友達の確かな励みだった。"],
    "努力家": ["漢字テストの練習など、地道な積み重ねを一日も欠かさず継続した。","苦手な課題に対しても投げ出さず、強い意志で向き合った。","自習ノートの充実ぶりから、自分を高めようとするひたむきな心が伝わった。","アドバイスを即座に吸収し、何度もやり直す向上心が眩しかった。","目立たない場所でもコツコツと準備を続ける、努力の天才と言える姿だった。","失敗を成長の糧と捉え、粘り強く再挑戦する姿には気高さが漂っていた。","自分の課題に静かに取り組む姿に、目標を成し遂げる執念を感じた。","目標を具体的に立て、そこへ向かうプロセスを一つずつ丁寧に歩んだ。","自分で課題を見つけて自律的に学ぶことができた。","地道な努力が大きな成果として花開く瞬間を何度も見せた。"],
    "リーダーシップ": ["全体の調和を考えながら前向きに声をかけ続け、クラスの心を繋ぐ大きな力となった。","自分の意見を主張する以上に、仲間の声を拾い上げ、全員が納得できる答えを探せた。","肯定的な言葉を真っ先に発し、再び走り出すきっかけを作ってくれた。","周囲を見守る眼差しが温かく、頼れる存在としての責任感を立派に果たした。","進んで困難な役目を引き受け、周囲を安心させるような力強さを見せた。"],
    "明るい": ["太陽のような笑顔で、クラスの雰囲気をパッと明るくしてくれた。","どんな時も肯定的な言葉をかけ、周囲を元気づける力があった。","元気な挨拶は、教室に活気を与える素敵な合図だった。","失敗を前向きに捉える、しなやかな心を持っていた。","楽しそうに活動する姿そのものが、周囲を幸せな気持ちにさせた。"],
    "礼儀正しい": ["誰に対しても丁寧な言葉を使い、相手を尊重する姿勢が身についていた。","授業の挨拶を背筋を伸ばして行う姿は、クラス全体の空気を整えてくれた。","すれ違う際も、立ち止まって会釈をするマナーの良さが光った。","感謝の言葉を日常的に素直に伝え、周囲を清々しい気持ちにさせた。","節度ある言動の中に、人としての誠実さと品格が滲み出ていた。"]
};

const learningData = {
    "A": ["授業の内容を深く理解し、常に一歩先を捉えた鋭い発言でクラスをリードした。","疑問点を自ら追求する探究心があり、納得がいくまで調べ学習に没頭した。","集中力が極めて高く、50分間の授業時間を最大限に活かして学びを深めた。","自律した学習習慣が確立されており、目標に向かって着実に力を伸ばした。"],
    "B": ["毎時間の授業に真面目な態度で臨み、教えられた内容を確実に定着させた。","分からないことをそのままにせず、粘り強く反復練習に取り組む誠実さがあった。","日々の積み重ねを怠らず、安定した力を発揮した。","基礎がしっかりと身についており、学期を追うごとに自信を深めていった。"],
    "C": ["学習の基礎を固めようと、自分のペースで丁寧に問題に向き合う時間が増えてきた。","友達の説明を真剣な表情で聞き、少しずつ理解を深めようとする歩みがあった。","提出物の期限を守ろうと努力し、最後まで自力で仕上げようとする責任感を見せた。","学期後半に向けて集中力が少しずつ増しており、今後の飛躍が期待される。"]
};

const roleData = {
    "委員会": ["委員会の責任ある立場を自覚し、学校全体の生活向上に大きく貢献した。","委員会の仕事において、皆が過ごしやすくなるよう細部まで心を砕いて活動した。","地道な活動も疎かにせず、委員としての務めを一年間立派に果たした。"],
    "係・当番": ["係活動において、クラスメイトのために自分ができることを工夫して取り組んだ。","誰も見ていない場所でも清掃の手を抜かず、黙々と取り組む姿が立派だった。","給食や掃除などの当番活動を、責任を持って最後までやり遂げた。"],
    "行事等": ["行事の実行委員として、みんなの意見をまとめ上げ成功に導いた。","グループのリーダーとして、全員が楽しく活動できるよう配慮を欠かさなかった。","クラス全体の成功のために汗を流す姿に感銘を受けた。"]
};

function setupRoster() {
    const input = document.getElementById('rosterInputArea').value;
    const lines = input.split('\n').filter(l => l.trim() !== "");
    const body = document.getElementById('studentBody');
    body.innerHTML = "";

    lines.forEach((line, index) => {
        const row = document.createElement('tr');
        
        // 1. 管理用氏名
        const nameCell = `<td class="name-col" id="name_${index}">${line}</td>`;

        // 2. オプション
        let traitOptions = `<div class="trait-grid">`;
        Object.keys(personalityData).forEach(trait => {
            traitOptions += `<label><input type="checkbox" name="trait_${index}" value="${trait}"> ${trait}</label>`;
        });
        traitOptions += `</div>`;

        const gradeOptions = `
            <div class="radio-group">
                <strong>学習:</strong>
                <label><input type="radio" name="grade_${index}" value="A"> A</label>
                <label><input type="radio" name="grade_${index}" value="B" checked> B</label>
                <label><input type="radio" name="grade_${index}" value="C"> C</label>
            </div>`;

        const roleOptions = `
            <div class="radio-group">
                <strong>役割:</strong>
                <label><input type="radio" name="role_${index}" value="委員会" checked> 委員会</label>
                <label><input type="radio" name="role_${index}" value="係・当番"> 係</label>
                <label><input type="radio" name="role_${index}" value="行事等"> 行事</label>
            </div>`;

        // 3. 生成・編集欄
        const outputCell = `
            <td class="output-col">
                <textarea class="result-box" id="output_${index}" placeholder="ここに生成されます。手入力も可能です。"></textarea>
                <button class="btn btn-gen" onclick="generateRow(${index})">この子の文章を生成</button>
                <button class="btn btn-copy" onclick="copyRow(${index})">コピー</button>
            </td>`;

        row.innerHTML = nameCell + `<td class="option-col">${traitOptions}${gradeOptions}${roleOptions}</td>` + outputCell;
        body.appendChild(row);
    });

    document.getElementById('mainSection').style.display = "block";
    window.scrollTo(0, document.getElementById('mainSection').offsetTop);
}

function generateRow(idx) {
    const traits = Array.from(document.querySelectorAll(`input[name="trait_${idx}"]:checked`)).map(el => el.value);
    const grade = document.querySelector(`input[name="grade_${idx}"]:checked`).value;
    const role = document.querySelector(`input[name="role_${idx}"]:checked`).value;

    if (traits.length === 0) {
        alert("性格を1つ以上選んでください。");
        return;
    }

    // 名前を入れずに生成
    let pPart = traits.map(t => {
        const arr = personalityData[t];
        return arr[Math.floor(Math.random() * arr.length)];
    }).join("");

    const lPart = learningData[grade][Math.floor(Math.random() * learningData[grade].length)];
    const rPart = roleData[role][Math.floor(Math.random() * roleData[role].length)];

    document.getElementById(`output_${idx}`).value = pPart + lPart + rPart;
}

function exportToCSV() {
    const rows = document.getElementById('studentBody').querySelectorAll('tr');
    if (rows.length === 0) return;

    let csvContent = "\uFEFF氏名,所見本文\n"; // BOM付きUTF-8

    rows.forEach((row, index) => {
        const name = document.getElementById(`name_${index}`).innerText;
        const text = document.getElementById(`output_${index}`).value.replace(/"/g, '""'); 
        csvContent += `"${name}","${text}"\n`;
    });

    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = "学級所見データ_一括出力.csv";
    link.click();
}

function copyRow(idx) {
    const text = document.getElementById(`output_${idx}`).value;
    navigator.clipboard.writeText(text).then(() => {
        const btn = event.target;
        btn.innerText = "完了！";
        setTimeout(() => btn.innerText = "コピー", 1000);
    });
}
</script>
</body>
</html>
