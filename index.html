<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>所見生成システム（最終調整版）</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; max-width: 900px; margin: 2em auto; padding: 0 1em; background: #f0f2f5; color: #333; }
        .card { background: white; padding: 2em; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 2em; }
        h1 { border-bottom: 2px solid #007bff; padding-bottom: 10px; font-size: 1.6em; color: #0056b3; }
        h3 { margin-top: 1.5em; font-size: 1.1em; color: #444; }
        input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .grid-traits { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-bottom: 1em; }
        .grid-traits label { background: #f8f9fa; padding: 8px; border-radius: 6px; cursor: pointer; border: 1px solid #ddd; font-size: 0.9em; text-align: center; }
        .radio-group { display: flex; gap: 15px; background: #e9ecef; padding: 10px; border-radius: 6px; }
        .btn-main { background: #007bff; color: white; border: none; padding: 12px 25px; border-radius: 6px; cursor: pointer; font-size: 1em; font-weight: bold; width: 100%; margin-top: 1em; }
        #output-area { background: #fffbe6; border: 2px dashed #ffd33d; padding: 1.5em; margin-top: 1.5em; min-height: 100px; white-space: pre-wrap; font-size: 1.1em; border-radius: 8px; }
        .btn-copy { background: #28a745; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; margin-top: 10px; width: 100%; }
    </style>
</head>
<body>

<div class="card">
    <h1>📝 所見生成システム</h1>
    
    <h3>1. 生徒の名前</h3>
    <input type="text" id="studentName" placeholder="名前を入力">

    <h3>2. 性格の選択（複数選択可）</h3>
    <div class="grid-traits" id="traitSelector"></div>

    <h3>3. 学習面の状況</h3>
    <div class="radio-group">
        <label><input type="radio" name="learning" value="A"> A（意欲的）</label>
        <label><input type="radio" name="learning" value="B" checked> B（着実）</label>
        <label><input type="radio" name="learning" value="C"> C（期待）</label>
    </div>

    <h3>4. 委員会・係活動</h3>
    <div class="radio-group">
        <label><input type="radio" name="role" value="委員会" checked> 委員会</label>
        <label><input type="radio" name="role" value="係・当番"> 係・当番</label>
        <label><input type="radio" name="role" value="行事・リーダー"> 行事・リーダー</label>
    </div>

    <button class="btn-main" onclick="generate()">所見を生成・シャッフル</button>
</div>

<div class="card">
    <h3>生成結果</h3>
    <div id="output-area">必要事項を選択してボタンを押してください。</div>
    <button class="btn-copy" onclick="copyToClipboard()">📋 文章をコピー</button>
</div>

<script>
const personalityData = {
    "優しい": ["友人の表情のわずかな曇りに気づき、そっと隣に座って耳を傾けるような、自然な優しさが光った。","自分のこと以上に、周りの友達が笑っていることを喜べる、とても心のきれいな姿が見られた。","輪に入りづらそうにしている子を見つけると、ごく自然に自分の隣を空けてあげる、柔らかい気遣いができた。","相手の痛みを自分のことのように考え、共感を持って語りかける姿に、何度も心が温まった。","相手を否定せず、最後まで話を丁寧に聞く姿勢を貫いた。","近くにいる友人の様子をさりげなく気遣い、必要な時にそっと寄り添う優しさを持っていた。","意見がぶつかっても、相手を尊重し柔軟に受け入れられる、大きな心を持っていた。","友人の失敗を責めることなく、再起を信じて温かく見守り続ける強さを見せた。","誰に対しても分け隔てなく接するその笑顔は、クラスの緊張をふんわりと解きほぐしてくれた。","自分の作業を止めてでも友人を手助けする姿は、見ていて胸が熱くなるほど素敵だった。"],
    "芯が強い": ["周囲に流されず、自分の考えをしっかりと持って行動できた。","困難な場面でも、瞳の奥に強い意志を宿して最後まで挑み抜いた。","自分が正しいと信じる道を、静かに、力強く歩む姿が印象的だった。","失敗してもすぐに前を向き、自分の足で立ち上がる強さを持っていた。","流行に左右されすぎず、自分らしさを大切にする姿が頼もしかった。","誰かに頼り切るのではなく、まずは自力で解決しようと努力できた。","目立たない場所でも、自分の信念を曲げずに役割を全うした。","批判を恐れず、自分の感性を大切に表現活動に励んだ。","逆境においてこそ、粘り強く踏ん張る精神力の強さを見せた。","静かな佇まいの中に、決して揺るがない自分軸を持っていた。"],
    "リーダーシップ": ["全体の調和を考えながら前向きに声をかけ続け、クラスの心を繋ぎ止める大きな力となった。","自分の意見を主張する以上に、仲間の声を拾い上げ、全員が納得できる答えを一緒に探せた。","クラスが壁にぶつかった時、肯定的な言葉を真っ先に発し、再び走り出すきっかけを作ってくれた。","周囲を見守る眼差しがとても温かく、頼れる存在としての責任感を立派に果たした。","進んで困難な役目を引き受け、周囲を安心させるような力強さを見せた。","みんなが輝ける場所を必死に作ろうとする、愛情深い姿勢であった。","責任ある役目も楽しみながら、周りをワクワクさせるような新しい挑戦をたくさん形にした。","議論がまとまらないとき、みんなの気持ちを汲み取って進むべき道を照らし出す役割を果たした。","彼／彼女の周りにはいつも笑顔が溢れていて、自然と周囲に勇気を与える魅力があった。","成功の喜びを仲間に譲り、困難は自ら引き受ける、高潔なリーダー像を見せた。"],
    "明るい": ["太陽のような笑顔で、クラスの雰囲気をパッと明るくしてくれた。","どんな時も肯定的な言葉をかけ、周囲を元気づける力があった。","元気な挨拶は、教室に活気を与える素敵な合図だった。","失敗を前向きに捉える、しなやかな心を持っていた。","楽しそうに活動する姿そのものが、周囲を幸せな気持ちにさせた。","行事の際も常に笑顔で、みんなの緊張をふんわりと解きほぐした。","新しい環境にもすぐ馴染み、誰とでも物怖じせずに関係を築くことができた。","授業中の何気ない一言が、クラスに心地よい和みをもたらした。","困難な状況でも前を向き、周囲を照らし出す強さと明るさがあった。","クラスのムードメーカーとして、常に中心で温かな光を放っていた。"],
    "親切": ["困っている子を見かけると、迷わずスッと手を差し伸べることができた。","下級生に対しても、目線を合わせて丁寧に教える姿が微笑ましかった。","落とし物を届けたりゴミを拾ったりと、さりげない善意が光った。","友人の落としたものをサッと拾い上げるような、自然な気遣いができた。","進んで手助けを申し出る姿勢に、救われた友達がクラスにたくさんいた。","自分のことだけでなく、常に周りの状況を見て動ける優しさがあった。","相手が何を求めているかを察して、先回りして行動することができた。","欠席した子への連絡を丁寧にまとめ、思いやりのある配慮を見せた。","共有スペースを整えるなど、次に使う人を想う行動が身についていた。","見返りを求めず、純粋な優しさから行動できる人柄が素晴らしかった。"],
    "活発": ["教室内での活動においても非常に意欲的で、活気ある学びの場を作り上げた。","授業中も積極的に挙手し、クラス全体の学びを力強く引っ張ってくれた。","何事にもフットワークが軽く、新しいことへも臆せず飛び込んでいった。","係の仕事や話し合いでは、持ち前のエネルギーを存分に発揮して場を盛り上げた。","自分の考えを豊かに表現する姿から、溢れる活力を感じた。","失敗を恐れず、まずはやってみるという機動力を見せた。","委員会活動などでも、自ら率先して動く姿が頼もしかった。","探究心が旺盛で、調べ学習などでも誰よりも熱心に知識を広めた。","常にエネルギーに溢れ、その前向きな勢いが周囲の良い刺激となった。","難しい課題にも、一歩前へ踏み出す明るい足取りで向き合った。"],
    "穏やか": ["常に落ち着いた物腰で、周囲に安心感を与える大切な存在だった。","争いごとを好まず、いつも平和的な解決を模索する優しさがあった。","友人の話を穏やかな表情で聞き、場を和ませる心地よい空気を持っていた。","感情を上手にコントロールし、誰に対しても一貫して優しく接した。","静かに読書や学習に没頭する姿は、クラスに落ち着いた雰囲気をもたらした。","他者のミスを包み込むような広い心を持ち、多くの友人に慕われた。","派手な主張はなくとも、そこにいるだけで心が温まる魅力があった。","トラブルが起きた際も、冷静に状況を見つめて公平な判断ができた。","一年間を通して、変わらぬ温厚な態度でクラスの調和を支え続けた。","周囲の喧騒に流されず、自分の時間を大切にしながら安定して生活できた。"],
    "努力家": ["漢字テストの練習など、地道な積み重ねを一日も欠かさず継続した。","苦手な課題に対しても投げ出さず、強い意志で向き合った。","自習ノートの充実ぶりから、自分を高めようとするひたむきな心が伝わった。","アドバイスを即座に吸収し、何度もやり直す向上心が眩しかった。","目立たない場所でもコツコツと準備を続ける、努力の天才と言える姿だった。","失敗を成長の糧と捉え、粘り強く再挑戦する姿には気高さが漂っていた。","自分の課題に静かに取り組む姿に、目標を成し遂げる執念を感じた。","目標を具体的に立て、そこへ向かうプロセスを一つずつ丁寧に歩んだ。","誰に言われるでもなく、自分で課題を見つけて自律的に学ぶことができた。","学期を追うごとに、地道な努力が大きな成果として花開く瞬間を何度も見せた。"],
    "礼儀正しい": ["誰に対しても丁寧な言葉を使い、相手を尊重する姿勢が身についていた。","授業の挨拶を背筋を伸ばして行う姿は、クラス全体の空気を整えてくれた。","すれ違う際も、立ち止まって会釈をするマナーの良さが光った。","感謝の言葉を日常的に素直に伝え、周囲を清々しい気持ちにさせた。","公共の場でのマナーを熟知し、適切な振る舞いを徹底した。","相手の話を聴くとき、目を見て適度な相槌を打ちながら聴いた。","脱いだ靴を揃えるといった日々の作法を、当たり前に継続できた。","時と場所に応じた適切な言動を、自分で判断して選択できた。","外部の講師や来客に対しても、礼を尽くした立派な対応ができた。","節度ある言動の中に、人としての誠実さと品格がしっかりと滲み出ていた。"],
    "面白い": ["独特な着眼点から生まれる言葉で、クラスにたくさんの笑いをもたらした。","ユーモア溢れる感性が、クラスの緊張をほぐす心地よいスパイスとなった。","自分の失敗談を明るく話し、周囲を励ますような強さを持っていた。","行事の出し物などで、独創的なアイデアを形にする豊かな感性を見せた。","語彙が豊富で、楽しい語り口を通して人を惹きつける魅力があった。","場の空気を読み、人を傷つけない優しい笑いを作るセンスが素晴らしかった。","難しい局面でも物事を前向きに楽しもうとする姿勢が、仲間の勇気になった。","クリエイティブな発想を活かし、学級の活動を大いに盛り上げた。","意外性のある視点を持ち、当たり前の景色を楽しく塗り替えてくれた。","持ち前のサービス精神で、クラスが一つになるきっかけを何度も作った。"],
    "真面目": ["与えられた役割を責任を持って果たし、周囲の信頼に応えた。","板書が非常に丁寧で、後で見返したときに分かりやすく整理されていた。","提出期限を厳守し、内容の充実した成果物を毎回提出した。","掃除の時間、見えない場所まで手を抜かずに磨き上げた。","授業中、余談に流されず、常に高い集中力を維持して臨んだ。","自分の非を素直に認め、同じミスを繰り返さないよう工夫した。","準備物や宿題を決して忘れず、落ち着いた生活態度を貫いた。","派手さはないが、一つひとつの行動が丁寧で確実性に満ちていた。","何が正しいかを一生懸命に考えて行動できる、誠実な人柄が光っていた。","地道な努力を積み重ねることを厭わない姿勢は、友達の確かな励みだった。"]
};

const learningData = {
    "A": ["授業の内容を深く理解し、常に一歩先を捉えた鋭い発言でクラスをリードした。","疑問点を自ら追求する探究心があり、納得がいくまで調べ学習に没頭した。","自分の考えを論理的に整理し、友達にも分かりやすく伝える表現力が光った。","どの教科にもバランスよく取り組み、常に質の高い成果物を完成させた。","難しい課題ほど楽しそうに挑戦し、粘り強く正解を導き出す力を見せた。","教科書の内容を超えて、自分の知識と結びつけて考える深い思考力を持っていた。","課題の提出期限を厳守するだけでなく、内容に独自の工夫を凝らして仕上げた。","集中力が極めて高く、50分間の授業時間を最大限に活かして学びを深めた。","グループ学習では、周囲の学びをさりげなくサポートする余裕も感じさせた。","自律した学習習慣が確立されており、目標に向かって着実に力を伸ばした。"],
    "B": ["毎時間の授業に真面目な態度で臨み、教えられた内容を確実に定着させた。","分からないことをそのままにせず、粘り強く反復練習に取り組む誠実さがあった。","漢字テストや計算ドリルなど、日々の積み重ねを怠らず、安定した力を発揮した。","ノートに並ぶ丁寧な文字から、一時間ごとの学びを大切にする姿勢が伝わった。","指導されたことを素直に吸収し、着実に自分の力に変えていくひたむきさがあった。","自分の得意な分野を活かしながら、全教科を通して意欲的に取り組むことができた。","授業中の受け答えがハキハキとしており、前向きに学ぼうとする姿勢が見られた。","周囲と協力しながら課題に取り組み、最後まで投げ出さずにやり遂げる強みがあった。","提出物の内容も丁寧で、学んだことを整理して定着させる工夫が見て取れた。","学習の基礎がしっかりと身についており、学期を追うごとに自信を深めていった。"],
    "C": ["分からない問題に直面しても、まずは自分で考えてみるという姿勢が見られた。","友達の説明を真剣な表情で聞き、少しずつ理解を深めようとする歩みがあった。","学習の基礎を固めようと、自分のペースで丁寧に問題に向き合う時間が増えてきた。","授業中の些細な発見に心を動かす姿があり、本来持っている探究心の強さを感じた。","提出物の期限を守ろうと努力し、最後まで自力で仕上げようとする責任感を見せた。","計算や漢字の練習において、前回より正解を増やそうと励むひたむきさがあった。","理解できた瞬間に表情が明るくなる様子は、学びの楽しさを感じ始めている証拠と言える。","周囲の助言を素直に受け入れ、一歩ずつ着実に進もうとする誠実さがあった。","自分の苦手なことからも目を逸らさず、粘り強く学び続ける姿勢があった。","学期後半に向けて学習への集中力が少しずつ増しており、今後の飛躍が期待される。"]
};

const roleData = {
    "委員会": ["委員会の責任ある立場を自覚し、学校全体の生活向上に大きく貢献した。","委員会の仕事において、皆が過ごしやすくなるよう細部まで心を砕いて活動した。","自分の当番ではない時も進んで委員会活動に協力する、責任感の強さを見せた。","委員会のリーダーとして、学年の枠を超えてメンバーをまとめ上げた。","地道な活動も疎かにせず、委員としての務めを一年間立派に果たした。"],
    "係・当番": ["係活動において、クラスメイトのために自分ができることを工夫して取り組んだ。","誰も見ていない場所でも清掃の手を抜かず、黙々と取り組む姿が立派だった。","給食や掃除などの当番活動を、責任を持って最後までやり遂げた。","友達が忘れている仕事に気づき、さりげなく代わりを務める優しさを見せた。","自分から仕事を見つける姿勢が頼もしかった。"],
    "行事・リーダー": ["行事の実行委員として、みんなの意見をまとめ上げ成功に導いた。","グループのリーダーとして、全員が楽しく活動できるよう配慮を欠かさなかった。","クラスを代表する役目に対し、誇りを持って最後まで堂々とやり遂げた。","準備期間中も仲間への励ましを忘れず、チームの士気を高める役割を担った。","自分の役割を超えて、クラス全体の成功のために汗を流す姿に感銘を受けた。"]
};

// 初期化
const selector = document.getElementById('traitSelector');
Object.keys(personalityData).forEach(trait => {
    const label = document.createElement('label');
    label.innerHTML = `<input type="checkbox" name="trait" value="${trait}"> ${trait}`;
    selector.appendChild(label);
});

function generate() {
    const name = document.getElementById('studentName').value || "〇〇";
    const selectedTraits = Array.from(document.querySelectorAll('input[name="trait"]:checked')).map(el => el.value);
    const learningGrade = document.querySelector('input[name="learning"]:checked').value;
    const roleCategory = document.querySelector('input[name="role"]:checked').value;

    if (selectedTraits.length === 0) {
        alert("性格を1つ以上選択してください。");
        return;
    }

    let result = `${name}さんは、`;
    let personalityPart = selectedTraits.map(t => {
        const p = personalityData[t];
        return p[Math.floor(Math.random() * p.length)];
    }).join("");

    const learningPart = learningData[learningGrade][Math.floor(Math.random() * learningData[learningGrade].length)];
    const rolePart = roleData[roleCategory][Math.floor(Math.random() * roleData[roleCategory].length)];

    result += personalityPart + learningPart + rolePart;
    document.getElementById('output-area').innerText = result;
}

function copyToClipboard() {
    const text = document.getElementById('output-area').innerText;
    navigator.clipboard.writeText(text).then(() => alert("コピーしました！"));
}
</script>
</body>
</html>
